name: build-exe

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean masking-service.spec
      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process dist\masking-service\masking-service.exe -PassThru
          Start-Sleep -Seconds 15
          try {
            $r = Invoke-RestMethod http://127.0.0.1:8765/api/health
            if ($r.status -ne "ok") { throw "health check failed: $($r | ConvertTo-Json)" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\masking-service\* -DestinationPath dist\masking-service-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: masking-service-portable-windows
          path: dist/masking-service-portable.zip
