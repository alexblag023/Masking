name: build-installer

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build installer package
        # --skip-tests: уже прогнали отдельным шагом; --allow-dirty: Actions clones без тегов,
        # лок-файла нет — build.py предупредит и соберёт из requirements.txt.
        run: python packaging/build.py --allow-dirty --skip-tests

      - name: Smoke test installer (silent install)
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\mk_target"
          New-Item -ItemType Directory -Path $target | Out-Null
          Start-Process -FilePath "dist\Установить_Masking.exe" -ArgumentList "--target $target" -Wait -NoNewWindow
          if (-not (Test-Path "$target\Masking\masking-service.exe")) { throw "Installer did not place masking-service.exe" }
          Get-Content "$target\Masking\compat.txt"
          # Запуск установленной программы и health-check.
          $p = Start-Process "$target\Masking\masking-service.exe" -PassThru
          Start-Sleep -Seconds 15
          try {
            $r = Invoke-RestMethod http://127.0.0.1:8765/api/health
            if ($r.status -ne "ok") { throw "health check failed: $($r | ConvertTo-Json)" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: masking-portable
          path: dist/Masking_*.zip

      - name: Upload installer exe
        uses: actions/upload-artifact@v4
        with:
          name: masking-installer
          path: dist/Установить_Masking.exe

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: masking-sbom
          path: dist/sbom.cdx.json
