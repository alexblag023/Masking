name: build-installer

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Минимальные привилегии токена workflow (ответ на CKV2_GHA_1).
# Явный read-only перекрывает умолчания; шаги, которым нужна запись, задают
# её точечно.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build installer package
        # --skip-tests: уже прогнали отдельным шагом; --allow-dirty: Actions clones без тегов,
        # лок-файла нет — build.py предупредит и соберёт из requirements.txt.
        run: python packaging/build.py --allow-dirty --skip-tests

      - name: Verify exe has icon + version info embedded
        shell: pwsh
        # Проверяем, что PyInstaller вшил ICO (RT_GROUP_ICON) и VERSIONINFO
        # (CompanyName/Copyright) в основной exe. Если тест упал — проблема в
        # сборке, а не в кэше иконок Windows на машине пользователя.
        run: |
          python -m pip install -q pefile
          python -c @"
          import glob, pefile, sys
          exe = glob.glob('dist/masking-service/masking-service.exe')[0]
          pe = pefile.PE(exe, fast_load=False)
          pe.parse_data_directories()
          kinds = {}
          for e in getattr(pe, 'DIRECTORY_ENTRY_RESOURCE', []).entries or []:
              name = pefile.RESOURCE_TYPE.get(e.struct.Id, f'ID_{e.struct.Id}')
              kinds[name] = kinds.get(name, 0) + 1
          print('resources:', kinds)
          assert 'RT_ICON' in kinds and kinds['RT_ICON'] >= 4, 'no icons in exe'
          assert 'RT_GROUP_ICON' in kinds, 'no icon group'
          assert 'RT_VERSION' in kinds, 'no version info'
          # VERSIONINFO: ищем CompanyName и Copyright
          fi = (pe.FileInfo or [])
          seen = set()
          for e in (fi[0] if fi else []):
              for st in getattr(e, 'StringTable', []) or []:
                  for k, v in st.entries.items():
                      seen.add(k.decode('utf-8', 'ignore'))
          assert 'CompanyName' in seen and 'LegalCopyright' in seen, f'missing fields: {seen}'
          print('version info OK:', sorted(seen))
          "@

      - name: Smoke test installer (silent install + headless service start)
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\mk_target"
          New-Item -ItemType Directory -Path $target | Out-Null
          Start-Process -FilePath "dist\Установить_Masking.exe" -ArgumentList "--target $target" -Wait -NoNewWindow
          if (-not (Test-Path "$target\Masking\masking-service.exe")) { throw "Installer did not place masking-service.exe" }
          Get-Content "$target\Masking\compat.txt"
          # Запускаем сервис, но без своего окна (CI headless): берём внутренний модуль
          # напрямую, uvicorn в текущем процессе, проверяем health.
          python -c @"
          import sys, pathlib, threading, time, socket, urllib.request
          sys.path.insert(0, r'$target\Masking\_internal')
          import uvicorn
          from masking.app import app
          cfg = uvicorn.Config(app, host='127.0.0.1', port=8765, log_level='warning', access_log=False)
          srv = uvicorn.Server(cfg)
          t = threading.Thread(target=srv.run, daemon=True); t.start()
          for _ in range(100):
              try:
                  with socket.create_connection(('127.0.0.1', 8765), timeout=0.3): break
              except OSError: time.sleep(0.1)
          r = urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read().decode()
          print('health:', r)
          assert '"status":"ok"' in r, r
          srv.should_exit = True; t.join(timeout=5)
          "@

      - name: Package source archive (for SAST / code review)
        shell: pwsh
        # Воспроизводимый снимок исходников на текущем коммите, без .git/build/dist.
        # Включает модели NER (~29 МБ) — чтобы содержимое совпадало с тем, из чего
        # собран exe, и чтобы на стороне получателя SBOM/SHA256 бились.
        run: |
          $sha = (git rev-parse --short HEAD)
          $zip = "dist\Masking_source_$sha.zip"
          git archive --format=zip --output=$zip HEAD
          Get-Item $zip | Select-Object Name, Length

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: masking-portable
          path: dist/Masking_*.zip

      - name: Upload installer exe
        uses: actions/upload-artifact@v7
        with:
          name: masking-installer
          path: dist/Установить_Masking.exe

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: masking-sbom
          path: dist/sbom.cdx.json

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: masking-source
          path: dist/Masking_source_*.zip
